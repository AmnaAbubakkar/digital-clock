<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock App</title>

    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Digital Clock</h1>

        <!-- Clock Section -->
        <div class="clock-box">

            <h2 id="time">00:00:00</h2>
            <p id="date">Loading Date...</p>

        </div>


        <!-- Alarm Section -->
        <div class="alarm-section">

            <h2>Set Alarm</h2>

            <div class="alarm-input">

                <input type="time" id="alarmTime">

                <button id="setAlarm">
                    Set Alarm
                </button>

                <button id="stopAlarm">
                    Stop Alarm
                </button>

            </div>

            <p id="alarmStatus">
                No Alarm Set
            </p>
             <select id="soundSelect">
               <option value="boat alarm.mpeg">Bell</option>
               <option value="loud alarm.mpeg">Ringtone</option>
               <option value="alarm tone.mpeg">Alarm 1</option>
               <option value="high volume.mpeg">Alarm 2</option>
            </select>
          <audio id="alarmSound" preload="auto"></audio>

        </div>


        <!-- Stopwatch Section -->
        <div class="stopwatch-section">

            <h2>Stopwatch</h2>

            <h2 id="stopwatch">
                00:00:00
            </h2>


            <div class="buttons">

                <button id="start">
                    Start
                </button>

                <button id="pause">
                    Pause
                </button>

                <button id="reset">
                    Reset
                </button>

            </div>


        </div>


    </div>

    <option value="loud alarm.mpeg">Ringtone</option>

    <option value="high volume.mpeg">Alarm 2</option>
</select> -->
    <!-- JavaScript file link -->
    <script src="script.js"></script>
</body>
</html>
